name = "api-gateway-formatho"
main = "src/index.js"
compatibility_date = "2026-08-01"

workers_dev = true  # advertised/backlinked URL — never disable

# Phase D (2026-10-07): owner created api.formatho.com DNS records (proxied, externally
# managed — custom_domain attach fails w/ code 100117, no dns_records scope to take over).
# Route pattern instead: intercepts before origin at the edge; zone must be in this account.
routes = [
  { pattern = "api.formatho.com/*", zone_name = "formatho.com" }
]

# Phase A of the paid-API-tier plan (backlog #1) — pure proxy via service
# bindings; no auth, no rate limits yet (Phase B/C). Custom domain
# api.formatho.com + pricing are owner gates (plan §9).

[[services]]
binding = "TOOL_JSON_FORMAT"
service = "json-formatter-formatho"

[[services]]
binding = "TOOL_BASE64"
service = "base64-formatho"

[[services]]
binding = "TOOL_URL_ENCODE"
service = "url-encoder-formatho"

[[services]]
binding = "TOOL_MD5"
service = "md5-generator-formatho"

[[services]]
binding = "TOOL_SHA256"
service = "sha256-generator-formatho"

[[services]]
binding = "TOOL_HASH"
service = "hash-generator-formatho"

[[services]]
binding = "TOOL_UUID"
service = "uuid-generator-formatho"

[[services]]
binding = "TOOL_RANDOM_STRING"
service = "random-string-formatho"

[[services]]
binding = "TOOL_SLUG"
service = "slug-generator-formatho"

[[services]]
binding = "TOOL_TIMESTAMP"
service = "timestamp-converter-formatho"

[[services]]
binding = "TOOL_JWT_DECODE"
service = "jwt-decoder-formatho"

[[services]]
binding = "TOOL_CRON_PARSE"
service = "cron-parser-formatho"

[[services]]
binding = "TOOL_CASE_CONVERT"
service = "case-converter-formatho"

[[services]]
binding = "TOOL_LOREM"
service = "lorem-ipsum-formatho"

# Phase B — anonymous per-IP rate limiting (plan §4). Keyed by CF-Connecting-IP
# in code. Limit values are placeholders pending owner pricing decisions
# (plan §9 gate 1); tuning = edit here + redeploy, no code change. Note: the
# simple limiter counts per Cloudflare colo (documented CF caveat) — fine for
# abuse control at current traffic. Handler fails open if the binding errors.
[[ratelimits]]
name = "FREE_ANON"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 30
  period = 60

# Phase C — keyed tiers (plan §4): FREE_KEY/PAID_KEY share the anon fail-open
# philosophy; same live caveat as FREE_ANON on free-plan workers.dev routes.
# Limits are placeholders pending owner pricing decisions (plan §9 gate 1).
[[ratelimits]]
name = "FREE_KEY"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "PAID_KEY"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 600
  period = 60

# Key store: hashed keys + aggregate usage counts only (plan §3). Free tier.
[[d1_databases]]
binding = "DB"
database_name = "formatho-api-db"
database_id = "0cabb605-7972-4073-b80e-bbf7f65960fe"
